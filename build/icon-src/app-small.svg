  </defs>
  <rect x="1" y="1" width="62" height="62" rx="14" fill="url(#tile)"/>
  <rect x="30" y="11" width="4" height="11" rx="2" fill="#5c6167"/>
  <circle cx="32" cy="11" r="5" fill="#5ae3d8"/>
  <rect x="7" y="21" width="50" height="37" rx="11" fill="url(#shell)"/>
  <rect x="12" y="26" width="40" height="27" rx="8" fill="#0e1012"/>
  <rect x="21" y="31" width="8" height="14" rx="4" fill="#5ae3d8"/>
