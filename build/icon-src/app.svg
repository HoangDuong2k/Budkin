<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Icon app Budkin (từ 48 px trở lên): đầu robot trên khối vuông bo góc màu than, góc trên hắt ánh đèn bàn ấm -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c2f34"/>
      <stop offset="1" stop-color="#111214"/>
    </linearGradient>
    <radialGradient id="lamp" cx="0.84" cy="0.1" r="0.7">
      <stop offset="0" stop-color="#ffe2bb" stop-opacity="0.24"/>
      <stop offset="0.5" stop-color="#ffd9a6" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#ffcf8a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f1ede6"/>
      <stop offset="0.55" stop-color="#d3cec6"/>
      <stop offset="1" stop-color="#a39d94"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="0.35" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="visor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#262b2f"/>
      <stop offset="1" stop-color="#090b0c"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="0.42" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="0.43" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="eye" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c4fff9"/>
      <stop offset="0.45" stop-color="#5ae3d8"/>
      <stop offset="1" stop-color="#27aaa0"/>
    </linearGradient>
    <radialGradient id="led" cx="0.38" cy="0.34" r="0.72">
      <stop offset="0" stop-color="#eafffd"/>
      <stop offset="0.42" stop-color="#5ae3d8"/>
      <stop offset="1" stop-color="#1a8a82"/>
    </radialGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#5ae3d8" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#5ae3d8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1f2225"/>
      <stop offset="0.5" stop-color="#4b4f55"/>
      <stop offset="1" stop-color="#1f2225"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="soft" x="-30%" y="-100%" width="160%" height="300%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
  </defs>

  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#tile)"/>
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#lamp)"/>
  <rect x="66" y="66" width="892" height="892" rx="198" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="4"/>

  <ellipse cx="512" cy="806" rx="270" ry="30" fill="#000000" opacity="0.6" filter="url(#soft)"/>

  <circle cx="512" cy="214" r="118" fill="url(#halo)"/>
  <rect x="499" y="224" width="26" height="124" rx="13" fill="url(#metal)"/>
  <circle cx="512" cy="212" r="42" fill="url(#led)"/>

  <rect x="204" y="468" width="64" height="156" rx="26" fill="url(#metal)"/>
  <rect x="756" y="468" width="64" height="156" rx="26" fill="url(#metal)"/>
  <rect x="222" y="514" width="10" height="64" rx="5" fill="#5ae3d8" opacity="0.75"/>
  <rect x="792" y="514" width="10" height="64" rx="5" fill="#5ae3d8" opacity="0.75"/>

  <rect x="244" y="332" width="536" height="440" rx="132" fill="url(#shell)"/>
  <rect x="248" y="336" width="528" height="432" rx="128" fill="none" stroke="url(#rim)" stroke-width="6"/>

  <rect x="302" y="394" width="420" height="308" rx="96" fill="url(#visor)"/>
  <g filter="url(#glow)" opacity="0.9">
    <rect x="398" y="474" width="72" height="122" rx="36" fill="#5ae3d8"/>
    <rect x="554" y="474" width="72" height="122" rx="36" fill="#5ae3d8"/>
  </g>
  <rect x="398" y="474" width="72" height="122" rx="36" fill="url(#eye)"/>
  <rect x="554" y="474" width="72" height="122" rx="36" fill="url(#eye)"/>
  <path d="M476 642 Q512 666 548 642" fill="none" stroke="#5ae3d8" stroke-width="16" stroke-linecap="round"/>
  <rect x="302" y="394" width="420" height="308" rx="96" fill="url(#glass)"/>
</svg>
