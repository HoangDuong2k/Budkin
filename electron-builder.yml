appId: com.budkin.app
productName: Budkin
# Không có module native nào cần build lại: SQLite dùng node:sqlite có sẵn trong Electron
npmRebuild: false
directories:
  output: release
  buildResources: build
files:
  - out/**
  # Ảnh dùng trong main process (icon khay), main tham chiếu tới qua đường dẫn ../../resources
  - resources/**
  - package.json
  - '!**/*.map'
# AppImage runtime tĩnh (không cần libfuse2 — Ubuntu 24.04+ chỉ còn libfuse3)
toolsets:
  appimage: '1.0.3'
win:
  # Icon (mặt robot) sinh từ build/icon-src bằng npm run icons
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
# Không làm bản Portable: không có AppUserModelId (thông báo không ổn định) và đường dẫn exe tạm làm hỏng "khởi động cùng Windows"
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  # Cài cho người dùng hiện tại, không cần quyền Administrator
  perMachine: false
  # Giao diện bộ cài tiếng Việt (LCID 1066)
  language: '1066'
  createDesktopShortcut: always
  createStartMenuShortcut: true
  runAfterFinish: true
  shortcutName: Budkin
  uninstallDisplayName: Budkin
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  # Gỡ cài đặt giữ lại dữ liệu người dùng (%APPDATA%\Budkin) — cài lại vẫn còn việc; muốn xoá hẳn thì xoá thư mục đó
  include: build/installer.nsh
  artifactName: ${productName}-Setup-${version}.${ext}
mac:
  # Icon (khối bo góc theo khung chuẩn của Apple) sinh từ build/icon-src bằng npm run icons
  icon: build/icon.icns
  category: public.app-category.productivity
  # Cả hai theme của app đều nền tối: thanh tiêu đề, hộp thoại hệ thống theo nativeTheme (luôn tối)
  darkModeSupport: true
  # Chưa có chứng chỉ Apple Developer: ký ad-hoc (Mac chip Apple bắt buộc app phải có chữ ký mới chạy), không notarize —
  # lần đầu mở, macOS chặn và người dùng phải bấm "Open Anyway" (xem README). Ký ad-hoc thì phải tắt hardened runtime
  # (bật thì macOS từ chối nạp các framework của Electron vì khác Team ID). Có chứng chỉ rồi: bỏ identity, bật lại
  # hardenedRuntime và notarize.
  identity: '-'
  hardenedRuntime: false
  target:
    - target: dmg
      arch: [arm64, x64]
dmg:
  # Mở .dmg: kéo Budkin vào lối tắt Applications bên cạnh
  title: ${productName} ${version}
  artifactName: ${productName}-${version}-${arch}.${ext}
linux:
  # deb là gói chính cho Ubuntu (tự cài profile AppArmor cho sandbox của Chromium trên Ubuntu 24.04+).
  # Không đặt executableArgs: AppRun của AppImage tự thêm --no-sandbox khi cần, còn deb thì không được thêm.
  target: [deb, AppImage]
  icon: build/icons
  category: Office
  maintainer: Hoang Duong <hoangdv@stringee.com>
  synopsis: Quản lý công việc trên bàn làm việc 3D
  # Đồng bộ tên file .desktop với app_id trên Wayland (biểu tượng đúng trên thanh dock, thông báo đúng tên app)
  syncDesktopName: true
  desktop:
    entry:
      GenericName: Quản lý công việc
      GenericName[en]: Task manager
      Comment[en]: Task manager on a 3D desk — the Budkin robot reminds you when things are due
      Keywords: task;todo;reminder;kanban;calendar;việc;viec;nhắc việc;nhac viec;lịch;lich;
      # Bấm chuột phải vào biểu tượng trên dock: Thêm việc nhanh
      Actions: QuickAdd;
    desktopActions:
      QuickAdd:
        Name: Thêm việc nhanh
        Name[en]: Quick add a task
        Exec: /opt/Budkin/budkin --quick-add
