name: Build

on:
  push:
    tags: ['v*']
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  # Máy CI không có GPU: WebGL vẽ bằng CPU (SwiftShader)
  BUDKIN_E2E_SWIFTSHADER: '1'

jobs:
  # Kiểm thử trên máy Windows và Linux thật: kiểu, unit test, e2e (điều khiển app bằng chuột thật)
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: E2E (Windows, màn hình máy ảo 1024×768)
        if: runner.os == 'Windows'
        run: npm run e2e
        env:
          BUDKIN_E2E_WINDOW: 1000x660
      - name: E2E (Linux, màn hình ảo)
        if: runner.os == 'Linux'
        run: xvfb-run -a -s "-screen 0 1920x1080x24" npm run e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots-${{ runner.os }}
          path: test-output/e2e/*.png
          if-no-files-found: ignore

  # Đóng gói bộ cài, rồi chạy e2e lần nữa trên chính bản đã đóng gói
  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run dist -- --publish never
      - name: E2E trên bản đóng gói (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: BUDKIN_E2E_EXE="$PWD/release/win-unpacked/Budkin.exe" BUDKIN_E2E_WINDOW=1000x660 npm run e2e
      - name: E2E trên bản đóng gói (Linux)
        if: runner.os == 'Linux'
        run: BUDKIN_E2E_EXE="$PWD/release/linux-unpacked/budkin" xvfb-run -a -s "-screen 0 1920x1080x24" npm run e2e
      # Ubuntu 24.04+ chặn user namespace: bản deb phải tự cài profile AppArmor thì sandbox của Chromium mới chạy
      - name: Cài bản .deb rồi kiểm thử mà không tắt sandbox
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y ./release/*.deb
          BUDKIN_E2E_EXE=/opt/Budkin/budkin BUDKIN_E2E_SANDBOX=1 xvfb-run -a -s "-screen 0 1920x1080x24" npm run e2e
      - uses: actions/upload-artifact@v4
        with:
          name: budkin-${{ runner.os }}
          path: |
            release/*.exe
            release/*.AppImage
            release/*.deb
          if-no-files-found: error
