name: Build

on:
  push:
    tags: ['v*']
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  # Máy CI không có GPU: WebGL vẽ bằng CPU (SwiftShader)
  BUDKIN_E2E_SWIFTSHADER: '1'

jobs:
  # Kiểm thử trên máy Windows, Linux và macOS thật: kiểu, unit test, e2e (điều khiển app bằng chuột thật)
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: E2E (Windows, màn hình máy ảo 1024×768)
        if: runner.os == 'Windows'
        run: npm run e2e
        env:
          BUDKIN_E2E_WINDOW: 1000x660
      - name: E2E (Linux, màn hình ảo)
        if: runner.os == 'Linux'
        run: xvfb-run -a -s "-screen 0 1920x1080x24" npm run e2e
      - name: E2E (macOS)
        if: runner.os == 'macOS'
        run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots-${{ runner.os }}
          path: test-output/e2e/*.png
          if-no-files-found: ignore

  # Đóng gói bộ cài, cài thật rồi chạy e2e trên bản đã cài, gỡ cài đặt
  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run dist -- --publish never
      # Windows: cài bằng chính bộ cài (im lặng, cho người dùng hiện tại) → e2e trên bản đã cài → lối tắt, "khởi động
      # cùng máy", --quick-add → gỡ cài đặt: mục tự khởi động, lối tắt, file cài đặt biến mất; dữ liệu người dùng còn
      - name: Cài Setup.exe, kiểm thử bản đã cài, gỡ cài đặt (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = (Get-ChildItem release\Budkin-Setup-*.exe)[0].FullName
          Start-Process $setup -ArgumentList '/S' -Wait
          $dir = "$env:LOCALAPPDATA\Programs\Budkin"
          $exe = "$dir\Budkin.exe"
          if (-not (Test-Path $exe)) { throw "Cài xong không thấy $exe" }
          $links = @("$([Environment]::GetFolderPath('Desktop'))\Budkin.lnk", "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Budkin.lnk")
          foreach ($l in $links) { if (-not (Test-Path $l)) { throw "Thiếu lối tắt $l" } }
          Write-Host "Đã cài: $exe, có lối tắt Desktop và Start Menu"

          $env:BUDKIN_E2E_EXE = $exe
          $env:BUDKIN_E2E_WINDOW = '1000x660'
          npm run e2e
          if ($LASTEXITCODE) { throw 'E2E trên bản đã cài thất bại' }
          npm run install-check -- --keep-autostart
          if ($LASTEXITCODE) { throw 'Kiểm tra bản đã cài thất bại' }

          $run = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run'
          Start-Process "$dir\Uninstall Budkin.exe" -ArgumentList '/S' -Wait
          # Bộ gỡ tự chép ra thư mục tạm rồi mới chạy: chờ tới khi file cài đặt biến mất
          for ($i = 0; $i -lt 90 -and (Test-Path $exe); $i++) { Start-Sleep 1 }
          if (Test-Path $exe) { throw 'Gỡ cài đặt xong vẫn còn Budkin.exe' }
          if (Get-ItemProperty $run -Name 'com.budkin.app' -ErrorAction SilentlyContinue) { throw 'Gỡ cài đặt không xoá mục tự khởi động' }
          foreach ($l in $links) { if (Test-Path $l) { throw "Gỡ cài đặt còn sót lối tắt $l" } }
          if (-not (Test-Path "$env:APPDATA\Budkin\budkin.db")) { throw 'Gỡ cài đặt xoá mất dữ liệu người dùng' }
          Write-Host 'Gỡ cài đặt: hết mục tự khởi động và lối tắt, dữ liệu người dùng vẫn còn'
      # macOS: mở .dmg như người dùng tải về — kiểm tra cả bản Intel và chip Apple (kiến trúc, chữ ký ad-hoc, lối tắt
      # Applications để kéo vào) → kéo bản chip Apple vào Applications → e2e trên bản đã cài, "khởi động cùng máy",
      # --quick-add, cầu nối MCP → xoá app (= gỡ cài đặt): dữ liệu người dùng phải còn
      - name: Cài từ .dmg, kiểm thử bản cài, gỡ cài đặt (macOS)
        if: runner.os == 'macOS'
        run: |
          set -e
          for arch in x64 arm64; do
            vol="/tmp/budkin-$arch"
            hdiutil attach -nobrowse -readonly -mountpoint "$vol" "$(ls release/Budkin-*-$arch.dmg)"
            test -L "$vol/Applications"
            codesign --verify --deep --strict --verbose=2 "$vol/Budkin.app"
            test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$vol/Budkin.app/Contents/Info.plist")" = com.budkin.app
          done
          test "$(lipo -archs /tmp/budkin-x64/Budkin.app/Contents/MacOS/Budkin)" = x86_64
          test "$(lipo -archs /tmp/budkin-arm64/Budkin.app/Contents/MacOS/Budkin)" = arm64
          app=/Applications/Budkin.app
          ditto /tmp/budkin-arm64/Budkin.app "$app"
          hdiutil detach /tmp/budkin-x64
          hdiutil detach /tmp/budkin-arm64
          echo "Đã cài: $app"

          BUDKIN_E2E_EXE="$app/Contents/MacOS/Budkin" npm run e2e
          BUDKIN_E2E_EXE="$app/Contents/MacOS/Budkin" npm run install-check

          rm -rf "$app"
          test ! -e "$HOME/Library/LaunchAgents/com.budkin.app.login.plist"
          test -f "$HOME/Library/Application Support/Budkin/budkin.db"
          echo 'Gỡ cài đặt (xoá app): không còn mục tự khởi động, dữ liệu người dùng vẫn còn'
      # AppImage: chạy e2e trên chính file AppImage (giải nén rồi chạy — máy CI không chắc có FUSE)
      - name: E2E trên bản AppImage (Linux)
        if: runner.os == 'Linux'
        run: |
          APPIMAGE_EXTRACT_AND_RUN=1 BUDKIN_E2E_EXE="$(ls "$PWD"/release/Budkin-*.AppImage)" \
            xvfb-run -a -s "-screen 0 1920x1080x24" npm run e2e
      # Ubuntu 24.04+ chặn user namespace: bản deb phải tự cài profile AppArmor thì sandbox của Chromium mới chạy
      - name: Cài .deb, kiểm thử không tắt sandbox, gỡ cài đặt (Linux)
        if: runner.os == 'Linux'
        run: |
          set -e
          sudo apt-get install -y ./release/budkin_*.deb
          test -x /opt/Budkin/budkin
          ls -l /etc/apparmor.d/budkin || echo '(không có profile AppArmor: máy không bật AppArmor)'
          test -f /usr/share/icons/hicolor/256x256/apps/budkin.png
          grep -q '^Actions=QuickAdd;' /usr/share/applications/budkin.desktop
          sudo apt-get install -y desktop-file-utils > /dev/null
          desktop-file-validate /usr/share/applications/budkin.desktop
          BUDKIN_E2E_EXE=/opt/Budkin/budkin BUDKIN_E2E_SANDBOX=1 xvfb-run -a -s "-screen 0 1920x1080x24" npm run e2e
          BUDKIN_E2E_EXE=/opt/Budkin/budkin BUDKIN_E2E_SANDBOX=1 xvfb-run -a -s "-screen 0 1920x1080x24" npm run install-check
          sudo apt-get remove -y budkin
          test ! -e /opt/Budkin/budkin
          test ! -e /usr/share/applications/budkin.desktop
          test ! -e /etc/apparmor.d/budkin
          test -f "$HOME/.config/Budkin/budkin.db"
          echo 'Gỡ cài đặt: hết file cài đặt và profile AppArmor, dữ liệu người dùng vẫn còn'
      - uses: actions/upload-artifact@v4
        with:
          name: budkin-${{ runner.os }}
          path: |
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/*.dmg
          if-no-files-found: error

  # Phát hành: đẩy tag v* (vd. git tag v0.1.0 && git push origin v0.1.0) → sau khi build + kiểm thử bản cài đều qua,
  # tạo GitHub Release kèm bộ cài Windows, .deb, AppImage, .dmg (macOS chip Apple / Intel) và mã băm SHA-256
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: budkin-*
          path: dist
          merge-multiple: true
      - name: Mã băm SHA-256
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
